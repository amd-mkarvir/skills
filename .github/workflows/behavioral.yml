name: behavioral

# Behavioral tests run a real agent against a skill and grade what it did (see
# eval/behavioral/). They cost real API tokens and, for some skills, install
# and exercise local models. The design:
#
#   * selective -- only the skills whose folder or test changed are run (the
#     whole suite runs when the shared harness changes). See
#     .github/scripts/select_behavioral.py.
#   * required when relevant -- when a PR changes a skill or test that maps to a
#     behavioral test, the `behavioral` gate FAILS until the tests pass. A PR
#     that touches nothing testable passes neutrally.
#   * dispatchable -- run any subset by hand from the Actions tab.
#   * hardware-aware -- skills that need specific hardware run on their own
#     runner pool. Which pool a skill uses is data, in
#     .github/scripts/runner_pools.json; each pool is implemented by one job
#     below, because Actions can't create jobs dynamically.
#   * opt-in for scarce pools -- the MI300X leg is scarce and expensive, so it
#     only runs on PRs carrying the `enable_mi_ci` label the registry names.
#
# Shape mirrors validate.yml: discover -> matrix -> single aggregate gate, so
# branch protection can require just the `behavioral` check.

on:
  pull_request:
    # `labeled` is here so adding `enable_mi_ci` to an open PR starts the
    # MI300X leg. Re-running an existing run would not work: the replayed
    # event payload is the one from before the label was applied.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "skills/**"
      - "eval/behavioral/**"
      - "eval/claude_eval.py"
      - ".github/workflows/behavioral.yml"
      - ".github/scripts/select_behavioral.py"
  workflow_dispatch:
    inputs:
      skills:
        description: "Comma-separated skill names to test (blank = every skill that has a behavioral test)."
        required: false
        default: ""

concurrency:
  group: behavioral-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which skills the change affects and which pool each one runs on.
  # This is secret-free (just git diff + a Python mapping). Its per-pool `run`
  # outputs drive whether each pool's job runs, and its `affected` outputs tell
  # the gate what it has to enforce for this PR.
  discover:
    name: Select behavioral tests
    runs-on: ubuntu-latest
    # One set of outputs per runner pool in runner_pools.json. `affected` means
    # the change touches a skill in the pool; `run` means that and the pool's
    # opt-in label (if it has one) is satisfied. Adding a pool to the registry
    # means adding its four outputs here and a job for it below.
    outputs:
      strix_halo_skills: ${{ steps.select.outputs.strix_halo_skills }}
      strix_halo_os: ${{ steps.select.outputs.strix_halo_os }}
      strix_halo_affected: ${{ steps.select.outputs.strix_halo_affected }}
      strix_halo_run: ${{ steps.select.outputs.strix_halo_run }}
      instinct_skills: ${{ steps.select.outputs.instinct_skills }}
      instinct_affected: ${{ steps.select.outputs.instinct_affected }}
      instinct_run: ${{ steps.select.outputs.instinct_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need the merge base so `git diff` can see what the PR changed.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Select skills
        id: select
        # Passed as env rather than interpolated into the script below so a
        # branch or dispatch input can't inject shell.
        env:
          DISPATCH_SKILLS: ${{ github.event.inputs.skills }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --plan groups the selected skills by runner pool and applies each
          # pool's opt-in label; see .github/scripts/runner_pools.json. `tee`
          # so the decision is readable in the log, not just consumed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run is already explicit human intent, so --dispatch
            # satisfies every pool's opt-in label without one being applied.
            if [ -n "$DISPATCH_SKILLS" ]; then
              select_args=(--names "$DISPATCH_SKILLS")
            else
              select_args=(--all)
            fi
            uv run .github/scripts/select_behavioral.py "${select_args[@]}" \
              --plan --github-output --dispatch | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | uv run .github/scripts/select_behavioral.py --changed \
                  --plan --github-output --labels "$PR_LABELS" \
              | tee -a "$GITHUB_OUTPUT"
          fi

  # The `strix_halo` pool: the default, so this runs every selected skill that
  # runner_pools.json does not assign elsewhere.
  behavioral:
    name: Behavioral (${{ matrix.skill }} on ${{ matrix.os }})
    needs: discover
    if: needs.discover.outputs.strix_halo_run == 'true'
    # Self-hosted Strix Halo runners. The OS label comes from the matrix below,
    # which the registry populates (Linux + Windows), so each skill is
    # exercised on both platforms.
    runs-on: [self-hosted, strix_halo, "${{ matrix.os }}"]
    # Behavioral runs install local models and can take a while; cap it so a
    # hung agent or stalled model pull fails the job instead of burning minutes.
    timeout-minutes: 45
    strategy:
      # One skill / OS failing should not hide the others' results.
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.strix_halo_skills) }}
        os: ${{ fromJson(needs.discover.outputs.strix_halo_os) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ORCHESTR_API_KEY }}
      ANTHROPIC_BASE_URL: https://llm-api.amd.com/Anthropic
      ANTHROPIC_CUSTOM_HEADERS: |
        Ocp-Apim-Subscription-Key: ${{ secrets.ORCHESTR_API_KEY }}
        user: a1_ucicd
      # Lets the harness default to this skill if a test relies on the env.
      BEHAVIORAL_SKILL: ${{ matrix.skill }}
      # Model pin: opus only. The harness also enforces this under CI.
      BEHAVIORAL_MODEL: opus
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install behavioral test dependencies
        run: pip install -r eval/behavioral/requirements.txt

      - name: Run behavioral test for ${{ matrix.skill }} (Linux)
        if: matrix.os == 'Linux'
        working-directory: eval/behavioral
        shell: bash
        run: |
          set -euo pipefail
          test_file="../../skills/${{ matrix.skill }}/evals/evals.py"
          echo "Running $test_file"
          python -m pytest -c pytest.ini -p conftest "$test_file"

      - name: Run behavioral test for ${{ matrix.skill }} (Windows)
        if: matrix.os == 'Windows'
        working-directory: eval/behavioral
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $skill = "${{ matrix.skill }}"
          $test_file = "../../skills/$skill/evals/evals.py"
          Write-Host "Running $test_file"
          python -m pytest -c pytest.ini -p conftest $test_file

  # The `instinct` pool: skills that serve models on AMD Instinct GPUs and so
  # can't run on the strix_halo runners above. Linux-only (ROCm + Docker); no
  # Windows leg, which is why the OS is fixed here rather than taken from the
  # registry. Assign a skill to this pool in runner_pools.json.
  #
  # Opt-in: `instinct_run` is true only when the change touches a skill in the
  # pool AND the PR carries the pool's `enable_mi_ci` label (or the run was
  # dispatched by hand).
  behavioral-instinct:
    name: Behavioral (${{ matrix.skill }} on MI300X)
    needs: discover
    if: needs.discover.outputs.instinct_run == 'true'
    runs-on: [self-hosted, Linux, X64, mi300x, gpu, rocm]
    timeout-minutes: 45
    # Scopes the Anthropic key to this job alone: only jobs that name this
    # environment can read its secrets, unlike a repo-level secret. Every skill
    # in this pool can therefore read it.
    environment: behavioral-instinct
    strategy:
      # The MI300X runners are scarce and these tests serve real models, so run
      # one skill at a time rather than in parallel.
      max-parallel: 1
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.instinct_skills) }}
    env:
      # The MI300X runner lives outside the AMD network, so it can't reach the
      # internal gateway the strix_halo jobs use. It calls api.anthropic.com
      # directly with its own budgeted key, hence no BASE_URL / CUSTOM_HEADERS.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BEHAVIORAL_SKILL: ${{ matrix.skill }}
      # Model pin: opus only. The harness also enforces this under CI.
      BEHAVIORAL_MODEL: opus
    steps:
      - name: Verify the Anthropic key is available
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY resolved to an empty value. GitHub withholds" >&2
            echo "secrets from pull requests opened from forks; re-run this from" >&2
            echo "a branch in amd/skills, or check that the secret is set on the" >&2
            echo "behavioral-instinct environment." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install behavioral test dependencies
        run: pip install -r eval/behavioral/requirements.txt

      - name: Run behavioral test for ${{ matrix.skill }}
        working-directory: eval/behavioral
        shell: bash
        run: |
          set -euo pipefail
          test_file="../../skills/${{ matrix.skill }}/evals/evals.py"
          echo "Running $test_file"
          python -m pytest -c pytest.ini -p conftest "$test_file"

  # Single aggregate gate. Mark THIS check required in branch protection.
  #
  #   * nothing testable changed -> pass (neutral).
  #   * testable change          -> pass iff the pool's job passed.
  #
  # A pool is only gated on when it was actually requested, so a PR that
  # touches a scarce-hardware skill without that pool's opt-in label is not
  # blocked by a test it deliberately skipped -- it just gets a warning.
  behavioral-gate:
    name: behavioral
    needs: [discover, behavioral, behavioral-instinct]
    if: always()
    runs-on: ubuntu-latest
    env:
      DISCOVER_RESULT: ${{ needs.discover.result }}
      # One `pool|affected|requested|result|skills` row per pool. Adding a pool
      # means adding a row (and its job to `needs` above).
      POOL_ROWS: |
        strix_halo|${{ needs.discover.outputs.strix_halo_affected }}|${{ needs.discover.outputs.strix_halo_run }}|${{ needs.behavioral.result }}|${{ needs.discover.outputs.strix_halo_skills }}
        instinct|${{ needs.discover.outputs.instinct_affected }}|${{ needs.discover.outputs.instinct_run }}|${{ needs.behavioral-instinct.result }}|${{ needs.discover.outputs.instinct_skills }}
    steps:
      - name: Verify behavioral results
        run: |
          set -euo pipefail
          echo "discover: $DISCOVER_RESULT"

          # If discovery itself failed, surface that rather than guessing: the
          # pool rows below would all be empty and we'd pass vacuously.
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "The discover job did not succeed ($DISCOVER_RESULT)." >&2
            exit 1
          fi

          requested_any=false
          failed=0
          while IFS='|' read -r pool affected requested result skills; do
            [ -n "$pool" ] || continue
            echo "$pool: affected=$affected requested=$requested result=$result ($skills)"

            # Touching a pool's skill without opting in is allowed, but say so
            # loudly: the change went out without running on that hardware.
            if [ "$affected" = "true" ] && [ "$requested" != "true" ]; then
              echo "::warning::This PR changes $skills, which run on the '$pool'" \
                   "pool, but the PR is missing that pool's opt-in label, so the" \
                   "test did not run. See .github/scripts/runner_pools.json."
            fi

            # A pool whose job wasn't triggered is 'skipped', which we ignore.
            if [ "$requested" = "true" ]; then
              requested_any=true
              if [ "$result" != "success" ]; then
                echo "Behavioral tests on the '$pool' pool did not pass ($result)." >&2
                failed=1
              fi
            fi
          done <<< "$POOL_ROWS"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          if [ "$requested_any" != "true" ]; then
            echo "No behavioral tests were requested for this change."
            exit 0
          fi
          echo "All affected behavioral tests passed."
          exit 0
