name: evals

# "Does this skill work?", in two halves, both read from the same per-skill
# datasets at skills/<name>/evals/evals.json:
#
#   * routing  -- installs the skills listed in `routing_skills` below side by
#     side and checks that each prompt activates the skill it should, and that
#     the ones which should activate nothing don't. It takes more than one skill
#     by nature: a skill tested alone will happily answer prompts that belong to
#     its neighbour.
#   * behavior -- installs one skill, runs the prompt to completion, and grades
#     what the agent actually did.
#
# The harness that does all of that is amd/skillscope, called below. Nothing
# about this catalog is encoded there: everything it needs to know about us is
# in the `with:` block, and what hardware a skill needs is in that skill's
# evals/machine.yml. The version of the harness that runs is the `version`
# input, not the ref below -- `@bootstrap` is a launcher contract that never
# changes, so bumping the harness is a one-line diff here instead of an edit to
# every caller. A skill can pin its own with `skillscope_version` in its
# evals.json, which governs that skill's behavior run.
#
# Product repos that own skills here run the same pipeline against their own
# tree; see CONTRIBUTING.md. That is the point of the split: a change is graded
# where it is authored, by the same harness, before it is ever imported.

on:
  pull_request:
    # `labeled` is here so adding a gate label (e.g. enable_mi_ci) to an open PR
    # starts that leg. Re-running an existing run would not work: the replayed
    # event payload is the one from before the label was applied.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "skills/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which grader to run."
        type: choice
        options: [both, routing, behavior]
        default: both
      skills:
        description: "Comma-separated skill names (blank = every skill with a dataset)."
        required: false
        default: ""
      only:
        description: "Comma-separated case ids to run (routing only)."
        required: false
        default: ""
      min_accuracy:
        description: "Fail the routing run below this accuracy (0-1). 0 reports without gating."
        required: false
        default: "0"
      version:
        description: "Harness version to try, overriding the pin below."
        required: false
        default: ""

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skill-evals:
    uses: amd/skillscope/.github/workflows/skill-evals.yml@bootstrap
    # The routing job and the default behavior runners use the repo-wide
    # gateway key; the Instinct legs bring their own, scoped to their
    # environment. Both are passed by name, so the harness never learns them.
    secrets: inherit
    with:
      # --- what this catalog looks like ------------------------------------
      skill_globs: skills/*
      # The skills a routing run puts in one workspace: the bundle a user
      # installs, from .claude-plugin/marketplace.json. Listed rather than
      # derived, because who a skill competes against is what its routing score
      # means -- a skill silently joining or leaving the room would move every
      # other skill's number with no diff to point at. A skill not listed here
      # still gets its dataset validated and its behavior cases run; it just
      # does not move anyone's routing score until it is added.
      routing_skills: >-
        local-ai-use,
        local-ai-app-integration,
        serving-llms-on-instinct,
        tracelens-analysis-orchestrator,
        hyperloom-workload-optimizer
      # This file holds the routing set and the harness pin, so a change to it
      # can move any result and has to re-run everything.
      infra_paths: .github/workflows/evals.yml
      # Our everyday pool. Skills run on both platforms unless their
      # evals/machine.yml narrows it.
      behavior_runner: '["self-hosted", "strix_halo"]'
      behavior_os: Linux,Windows
      # Legs whose skill asks for hardware labels start from these instead.
      # Gated because the Instinct pool is scarce, and separately credentialed
      # because it sits outside the AMD network and calls api.anthropic.com with
      # its own budgeted key rather than the internal gateway.
      scoped_runner: '["self-hosted", "Linux", "X64"]'
      scoped_gate: enable_mi_ci
      scoped_environment: behavioral-instinct

      # --- what to run this time -------------------------------------------
      mode: ${{ inputs.mode || 'both' }}
      skills: ${{ inputs.skills || '' }}
      only: ${{ inputs.only || '' }}
      min_accuracy: ${{ inputs.min_accuracy || '0' }}
      # Tracking `main` until skillscope cuts releases: one line to change when
      # it does.
      version: ${{ inputs.version || 'main' }}
      # This catalog grades the required dataset only. A product repo's extra
      # prompts are that repo's bill to pay; extended datasets are still
      # structurally validated here.
      extended: false
      routing_runner: '["self-hosted", "strix_halo", "Linux"]'
      api_key_secret: ORCHESTR_API_KEY
      api_base_url: https://llm-api.amd.com/Anthropic
      api_custom_headers: |
        Ocp-Apim-Subscription-Key: $API_KEY
        user: a1_ucicd
      # The Instinct runner sits outside the AMD network and calls
      # api.anthropic.com directly with its own budgeted key, so it sets no
      # gateway base URL or headers.
      scoped_api_key_secret: ANTHROPIC_API_KEY

  # Single aggregate gate. Mark THIS check required in branch protection.
  #
  # It exists so the required check keeps the name it had before the harness
  # moved out: a job inside a called workflow reports as `<caller job> / <job>`,
  # which would silently stop matching a protection rule that requires `evals`.
  evals:
    name: evals
    needs: skill-evals
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify eval results
        env:
          RESULT: ${{ needs.skill-evals.result }}
        run: |
          echo "skill-evals: $RESULT"
          # The called workflow always ends in an aggregate job that runs even
          # when every leg was skipped, so `skipped` here means the whole
          # workflow was cancelled or never dispatched, not that nothing was
          # affected. Its own gate has already decided whether the legs that
          # ran were enough.
          case "$RESULT" in
            success|skipped)
              echo "All affected evals passed."
              ;;
            *)
              echo "The eval pipeline did not pass ($RESULT)." >&2
              exit 1
              ;;
          esac
